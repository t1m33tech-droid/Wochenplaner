<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wochenplaner</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--ink:#2b2a33;--mute:#8a8794;--line:#e8e2d8;--acc:#e0694a;--acc2:#3f7d73;--gold:#e9a825;--today:#fff1ea;--shadow:0 2px 10px rgba(60,40,20,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161c;--card:#211f28;--ink:#efece6;--mute:#9a97a6;--line:#33303d;--acc:#f08a6c;--acc2:#6fb5a8;--gold:#f2b84b;--today:#2e2420;--shadow:0 2px 10px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#17161c;--card:#211f28;--ink:#efece6;--mute:#9a97a6;--line:#33303d;--acc:#f08a6c;--acc2:#6fb5a8;--gold:#f2b84b;--today:#2e2420;--shadow:0 2px 10px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 120px}
h1{margin:0;font:700 clamp(1.6rem,6vw,2.2rem)/1.1 Georgia,"Times New Roman",serif}
.sub{color:var(--mute);font-size:.95rem;margin-top:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:44px}
button:active{transform:scale(.97)}
.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.nav{display:flex;gap:6px}
.nav button{padding:8px 13px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;border:2px solid transparent;min-height:72px}
.row.today{background:var(--today);border-color:var(--acc)}
.row.goals{border-left:6px solid var(--acc2);border-radius:16px}
.row .mid{flex:1;min-width:0}
.row b{font-size:1.05rem;display:block}
.row small{color:var(--mute)}
.bar{height:7px;border-radius:7px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:7px;transition:width .5s}
.pct{font-weight:700;font-size:1.05rem;min-width:46px;text-align:right;color:var(--acc2)}
.pct.full{color:var(--gold)}
.chev{color:var(--mute);font-size:1.3rem}
.ringbox{display:flex;flex-direction:column;align-items:center;margin:6px 0 16px}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--acc2);transition:stroke-dashoffset .7s,stroke .3s}
.ring.full .fg{stroke:var(--gold)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 2rem/1 Georgia,serif}
.ring .num small{font:.8rem system-ui,sans-serif;color:var(--mute);margin-top:4px}
.ring.pop{animation:pop .7s}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-4deg)}70%{transform:scale(.96)}100%{transform:scale(1)}}
.win{color:var(--gold);font-weight:700;margin-top:8px;font-size:1.1rem;animation:fade .6s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px 8px 6px 14px;margin-bottom:8px;min-height:54px}
li input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc2);flex:none}
li .t{flex:1;word-break:break-word;padding:6px 0}
li.done .t{text-decoration:line-through;color:var(--mute)}
.tm{font-size:.78rem;background:var(--line);border-radius:7px;padding:2px 7px;margin-right:7px;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);font-size:1.5rem;padding:0 12px;min-height:44px}
.empty{text-align:center;color:var(--mute);padding:26px 0}
.addbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.add{display:flex;gap:8px;max-width:720px;margin:0 auto}
.add input{min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:46px}
.add input[type=text]{flex:1}
.add input[type=time]{width:96px;flex:none}
.add button{flex:none;width:50px;font-size:1.4rem;padding:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.em{font-size:1.5rem;flex:none}
.hero{display:block;width:100%;text-align:left;background:var(--acc);border:0;color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero.done{background:var(--gold)}
.hero small{opacity:.85}
.hero b{font-size:1.25rem;display:block}
.hero .hh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .big{font:700 2rem/1 Georgia,serif}
.hero .bar{background:rgba(255,255,255,.3);margin:10px 0}
.hero .bar i{background:#fff}
.hero .nx{display:flex;gap:8px;padding:3px 0;font-size:.95rem}
.row small{display:block;line-height:1.3}
.row .mid{flex:1 1 0}
.row.mini{min-height:44px;padding:8px 14px;margin-bottom:6px;gap:10px;box-shadow:none;background:transparent;border:1px solid var(--line);border-radius:12px;font-size:.9rem;color:var(--mute)}
.mini .mn{font-weight:700;width:24px;flex:none}
.mini .md{flex:none;width:62px}
.mini .ms{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mp{flex:none;font-weight:700}
.row.mini.ok{border-color:var(--acc2)}
.mini.ok .ms,.mini.ok .mp{color:var(--acc2)}
.row.mini.grp{border-style:dashed;justify-content:space-between;margin-top:8px}
.row.past{background:transparent;box-shadow:none;border-color:var(--line);color:var(--mute)}
.row.past b{font-weight:600}
.row.good{border-color:#3fa56b}
.row.bad{border-color:#e8613a}
.row.past.good{background:color-mix(in srgb,#3fa56b 8%,transparent)}
.row.past.bad{background:color-mix(in srgb,#e8613a 8%,transparent)}
.row.past.good small{color:#3fa56b}
.row.past.bad small{color:#e8613a}
.kw{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.sheet{max-height:92vh;overflow:auto}
.cm{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cm button{width:46px;font-size:1.3rem;padding:0}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cg>span{text-align:center;font-size:.75rem;color:var(--mute);align-self:center}
.cd{position:relative;padding:0;min-height:44px;border:2px solid transparent;background:none;font-size:1rem;border-radius:10px}
.cd.out{color:var(--mute);opacity:.45}
.cd.td{border-color:var(--acc)}
.cd i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc2)}
.cd i.g{background:var(--gold)}
button.wk{padding:0;min-height:44px;font-size:.85rem;border:0;background:var(--line);border-radius:10px;color:var(--mute);font-weight:600}
button.wk.cur{background:var(--acc);color:#fff}
.hint{text-align:center;color:var(--mute);font-size:.8rem;margin:0 0 10px}
.add .opt{width:50px;font-size:1.4rem}
.add .opt.tb{width:auto;min-width:56px;font-size:1rem;padding:0 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadeo .2s}
@keyframes fadeo{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.sheet{width:100%;max-width:720px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s}
.sheet h3{margin:0 0 8px;text-align:center}
.eg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:50vh;overflow:auto;margin-bottom:12px}
.eg button{font-size:1.6rem;padding:6px 0}
.full{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wheel{position:relative;display:flex;justify-content:center;gap:6px;height:200px;margin:10px 0 16px}
.sel{position:absolute;left:20%;right:20%;top:80px;height:40px;background:var(--line);border-radius:12px;opacity:.7;pointer-events:none;z-index:0}
.col{position:relative;z-index:1;width:90px;height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:80px 0;scrollbar-width:none;overscroll-behavior:contain}
.col::-webkit-scrollbar{display:none}
.it{height:40px;line-height:40px;text-align:center;font-size:1.3rem;color:var(--mute);scroll-snap-align:center;cursor:pointer}
.it.on{color:var(--ink);font-weight:700;font-size:1.7rem}
.colon{align-self:center;font-size:1.7rem;font-weight:700;position:relative;z-index:1}
.evc{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px;border-left:6px solid var(--acc)}
.evh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.evh button{padding:6px 12px;min-height:36px;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.evr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px dashed var(--line);background:none;border-radius:0;padding:8px 0;min-height:50px}
.evr.old{opacity:.5}
.evm{flex:1;min-width:0}
.evm b{display:block}
.evm small{color:var(--mute)}
.tag{background:var(--acc);color:#fff;border-radius:8px;font-size:.72rem;padding:2px 8px;font-weight:600;flex:none}
.empty2{color:var(--mute);font-size:.9rem;padding:8px 0 4px}
.fg{display:grid;gap:10px;margin-bottom:12px}
.fg input{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.dev{margin:0 0 12px}
.dev .evr{background:var(--card);border:0;border-left:5px solid var(--acc);border-radius:12px;padding:8px 12px;margin-bottom:6px;box-shadow:var(--shadow)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<canvas id="fx"></canvas>
<script>
const DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
let data={tasks:{},goals:{}};
try{const s=localStorage.getItem("wochenplaner-v1");if(s)data=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem("wochenplaner-v1",JSON.stringify(data))}catch(e){}}
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let start=monday(new Date());
let view=null; // null = Woche, {goals:true} oder {date:Date}
let celebrate=false;
const listOf=k=>k.startsWith("goals:")?(data.goals[k.slice(6)]||(data.goals[k.slice(6)]=[])):(data.tasks[k]||(data.tasks[k]=[]));
const pct=l=>l&&l.length?Math.round(l.filter(t=>t.d).length/l.length*100):0;
const curKey=()=>key(view.date);
const sorted=l=>l.slice().sort((a,b)=>(a.tm||"99")>(b.tm||"99")?1:-1);

let PASTS=[],showPast=false;
function dayRow(d,i,todayK){
  const k=key(d),l=data.tasks[k]||[],p=pct(l),dn=l.filter(t=>t.d).length,full=l.length&&p==100,past=k<todayK,cur=key(monday(new Date()))===key(start);
  if(k===todayK)return "";
  if(!past)return null;
  const r=`<button class="row mini ${full?"ok":""}" data-day="${k}"><span class="mn">${DAYS[i].slice(0,2)}</span><span class="md">${d.getDate()}. ${MON[d.getMonth()]}</span><span class="ms">${full?"Alles erledigt":l.length?dn+" von "+l.length+" erledigt":"nichts geplant"}</span><span class="mp">${full?"✓":l.length?p+"%":""}</span></button>`;
  const op=l.length-dn;return `<button class="row past ${!l.length?"":op?"bad":"good"}" data-day="${k}"><div class="mid"><b>${DAYS[i]}</b><small>${d.getDate()}. ${MON[d.getMonth()]}${op?` · ${op} offen`:""}</small></div><span class="chev">›</span></button>`;
  return r;
}
function pastBlock(){
  if(!PASTS.length)return "";
  return `<button class="row mini grp" data-past="1"><span class="ms">Vergangene Tage (${PASTS.length})</span><span class="mp">${showPast?"▴":"▾"}</span></button>`+(showPast?PASTS.join(""):"");
}
function hero(){PASTS=[];
  const now=new Date();if(key(monday(now))!==key(start))return"";
  const k=key(now),l=data.tasks[k]||[],p=pct(l),op=l.filter(t=>!t.d),show=sorted(op).slice(0,3),full=l.length&&p==100;
  const body=!l.length?`<div class="nx">Noch nichts geplant – tippe, um Aufgaben hinzuzufügen</div>`:show.length?show.map(t=>`<div class="nx"><span>${t.e||"📝"}</span><span>${t.tm?t.tm+" · ":""}${esc(t.t)}</span></div>`).join("")+(op.length>3?`<small>+ ${op.length-3} weitere</small>`:""):"";
  return `<button class="hero ${full?"done":""}" data-day="${k}"><div class="hh"><div><small>${full?"Heute · alles geschafft":"Heute"}</small><b>${DAYS[(now.getDay()+6)%7]}, ${now.getDate()}. ${MON[now.getMonth()]}</b></div><span class="big">${full?"🎉":p+"%"}</span></div>${full?"":`<div class="bar"><i style="width:${p}%"></i></div>`}${body}</button>`;
}
function weekView(){
  const end=new Date(start);end.setDate(end.getDate()+6);const todayK=key(new Date());
  const gl=data.goals[key(start)]||[],gp=pct(gl);
  let h=`<div class="top"><div><h1>Mein Wochenplaner</h1><div class="sub">${start.getDate()}. ${MON[start.getMonth()]} – ${end.getDate()}. ${MON[end.getMonth()]} ${end.getFullYear()}</div></div><button data-snd="1" aria-label="Sound an oder aus">${data.mute?"🔇":"🔊"}</button></div>
  <div class="top"><div class="nav"><button data-w="-7" aria-label="Vorherige Woche">←</button><button data-w="0" class="primary">Heute</button><button data-w="7" aria-label="Nächste Woche">→</button></div><button class="kw" data-jump="1" aria-label="Datum auswählen">📅 Datum</button></div>
  ${hero()}${eventsCard()}`;
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);const l=data.tasks[key(d)]||[],p=pct(l);
    h+=dayRow(d,i,todayK)??`<button class="row ${key(d)===todayK?"today":""} ${p==100?"good":""}" data-day="${key(d)}"><div class="mid"><b>${DAYS[i]}</b><small>${d.getDate()}. ${MON[d.getMonth()]} · ${l.length?l.filter(t=>t.d).length+" von "+l.length+" erledigt":"nichts geplant"}</small><div class="bar"><i style="width:${p}%"></i></div></div><span class="pct ${p==100?"full":""}">${p==100?"🎉":p+"%"}</span><span class="chev">›</span></button>`;
  }
  return h+pastBlock();
}
function dayView(){
  const k=curKey(),l=listOf(k),p=pct(l),full=p==100,C=2*Math.PI*64;
  let title,sub;
  if(view.goals){title="Meine Woche";sub="Ziele für "+start.getDate()+". "+MON[start.getMonth()]+" – "+new Date(start.getFullYear(),start.getMonth(),start.getDate()+6).getDate()+". "+MON[new Date(start.getFullYear(),start.getMonth(),start.getDate()+6).getMonth()]}
  else{const d=view.date;title=DAYS[(d.getDay()+6)%7];sub=d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear()}
  return `<div class="top"><button data-back="1">← Woche</button>${view.goals?"":`<div class="nav"><button data-step="-1" aria-label="Vorheriger Tag">‹</button><button data-step="1" aria-label="Nächster Tag">›</button></div>`}</div>
  <h1>${title}</h1><div class="sub">${sub}</div>
  <div class="ringbox"><div class="ring ${full?"full":""} ${celebrate?"pop":""}"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="64"/><circle class="fg" cx="75" cy="75" r="64" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/></svg><div class="num">${p}%<small>${l.filter(t=>t.d).length} / ${l.length}</small></div></div>${full?`<div class="win">Alles geschafft! 🎉</div>`:""}</div>
  ${dayEvents(k)}<ul>${l.length?sorted(l).map(t=>`<li class="${t.d?"done":""}"><input type="checkbox" data-id="${t.id}" ${t.d?"checked":""}><span class="em">${t.e||"📝"}</span><span class="t">${t.tm?`<span class="tm">${t.tm}</span>`:""}${esc(t.t)}</span><button class="x" data-del="${t.id}" aria-label="Löschen">×</button></li>`).join(""):`<div class="empty">Noch nichts geplant.<br>Füge unten deine erste Aufgabe hinzu.</div>`}</ul>
  <div class="addbar"><div class="add"><button class="opt" data-emoji="1" id="eb" aria-label="Emoji wählen">${draft.e||"✨"}</button><input type="text" id="in" placeholder="${view.goals?"Wochenziel …":"Neue Aufgabe …"}" enterkeyhint="done">${view.goals?"":`<button class="opt tb" data-time="1" id="tb" aria-label="Uhrzeit wählen">${draft.tm||"🕒"}</button>`}<button class="primary" data-add="1" aria-label="Hinzufügen">+</button></div></div>`;
}
function render(){
  document.getElementById("app").innerHTML=view?dayView():weekView();
  if(celebrate){celebrate=false;confetti()}
}
function add(){
  const v=document.getElementById("in").value.trim();if(!v)return;
  listOf(curKey()).push({id:uid(),t:v,tm:view.goals?"":draft.tm,e:draft.e||suggest(v),d:false});
  draft={e:"",tm:""};save();snd("add");render();document.getElementById("in").focus();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const D=b.dataset;
  if(D.day||D.goals||D.back||D.step||D.w!==undefined)snd("nav");
  if(D.w!==undefined){start=D.w==="0"?monday(new Date()):new Date(start.getFullYear(),start.getMonth(),start.getDate()+ +D.w)}
  else if(D.evadd){openEvent();return}
  else if(D.ev){openEvent(D.ev);return}
  else if(D.day){const [y,m,d]=D.day.split("-");view={date:new Date(+y,m-1,+d)};scrollTo(0,0)}
  else if(D.back){view=null}
  else if(D.step){const d=view.date;view={date:new Date(d.getFullYear(),d.getMonth(),d.getDate()+ +D.step)};start=monday(view.date)}
  else if(D.emoji){openEmoji();return}
  else if(D.time){openTime();return}
  else if(D.add){add();return}
  else if(D.del){const l=listOf(curKey());l.splice(l.findIndex(t=>t.id===D.del),1);save();snd("del")}
  else if(D.snd){data.mute=!data.mute;save();snd("add")}
  else if(D.past){showPast=!showPast;snd("tick")}
  else if(D.jump){openJump();return}
  else return;
  render();
});
document.addEventListener("change",e=>{
  const c=e.target;if(c.type!=="checkbox"||!c.dataset.id)return;
  const l=listOf(curKey()),t=l.find(t=>t.id===c.dataset.id),before=pct(l);
  t.d=c.checked;save();if(before<100&&pct(l)==100)celebrate=true;snd(celebrate?"win":c.checked?"check":"uncheck");render();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="in")add()});
function confetti(){
  const cv=document.getElementById("fx"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#e0694a","#e9a825","#3f7d73","#6fb5a8","#f08a6c","#8e7cc3"];
  const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function step(){x.clearRect(0,0,cv.width,cv.height);f++;
    ps.forEach(p=>{p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-f/130);x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    if(f<130)requestAnimationFrame(step);else x.clearRect(0,0,cv.width,cv.height)})();
}
const PAL=[{n:"Korall",a:"#e0694a",b:"#3f7d73"},{n:"Ozean",a:"#2f7fd1",b:"#1f9e94"},{n:"Wald",a:"#3d9a5b",b:"#c0833a"},{n:"Lavendel",a:"#8a63d2",b:"#d1649b"},{n:"Sonne",a:"#e6a01a",b:"#d9573f"},{n:"Beere",a:"#c93d6e",b:"#5b6ad6"},{n:"Minze",a:"#1fa896",b:"#4a86c8"},{n:"Abendrot",a:"#e0663a",b:"#a8478f"}];
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
const pi=()=>isoWeek(start)%PAL.length;
let AC;
function tone(f,t,d,ty,v,f2){const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=ty||"sine";o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.15,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02)}
function snd(n){if(data.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  if(n==="check"){tone(660,0,.1,"triangle",.18);tone(990,.08,.16,"triangle",.18)}
  else if(n==="uncheck")tone(330,0,.14,"sine",.14,200);
  else if(n==="add"){tone(520,0,.09,"square",.05);tone(780,.07,.12,"square",.05)}
  else if(n==="del")tone(420,0,.2,"sawtooth",.05,110);
  else if(n==="nav")tone(600,0,.06,"sine",.08,760);
  else if(n==="tick")tone(1400,0,.03,"sine",.07);
  else if(n==="win"){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,i==4?.5:.18,"triangle",.2));[2093,2637,3136].forEach((f,i)=>tone(f,.45+i*.07,.12,"sine",.05))}
}catch(e){}}
const MONN=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function openJump(){
  let cy=start.getFullYear(),cm=start.getMonth();
  const o=sheet(`<h3>Springen zu …</h3><p class="hint">Tippe auf ein Datum.</p><div id="cal"></div><button class="full primary" data-jt="1">Heute öffnen</button>`);
  const cal=o.querySelector("#cal"),todayK=key(new Date());
  const draw=()=>{
    const last=new Date(cy,cm+1,0),g=monday(new Date(cy,cm,1));
    let h=`<div class="cm"><button data-jm="-1" aria-label="Vorheriger Monat">‹</button><b>${MONN[cm]} ${cy}</b><button data-jm="1" aria-label="Nächster Monat">›</button></div><div class="cg">${DAYS.map(d=>`<span>${d.slice(0,2)}</span>`).join("")}`;
    for(let w=0;w<6;w++){
      const m=new Date(g.getFullYear(),g.getMonth(),g.getDate()+w*7);if(m>last)break;
      
      for(let i=0;i<7;i++){const d=new Date(m.getFullYear(),m.getMonth(),m.getDate()+i),l=data.tasks[key(d)]||[];
        h+=`<button class="cd ${d.getMonth()!==cm?"out":""} ${key(d)===todayK?"td":""}" data-jd="${key(d)}">${d.getDate()}${l.length?`<i class="${pct(l)==100?"g":""}"></i>`:""}</button>`}
    }
    cal.innerHTML=h+"</div>";
  };
  draw();
  o.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;const D=b.dataset;
    if(D.jm){cm+=+D.jm;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}draw();snd("tick");return}
    const go=(k,day)=>{const [y,m,d]=k.split("-"),dt=new Date(+y,m-1,+d);start=monday(dt);view=day?{date:dt}:null;o.remove();snd("nav");scrollTo(0,0);render()};
    if(D.jd)go(D.jd,true);else if(D.jt)go(todayK,true);
  });
}
data.events=data.events||[];
const evKey=e=>e.date+(e.tm||"99");
const evSorted=a=>a.slice().sort((x,y)=>evKey(x)>evKey(y)?1:-1);
function evFmt(e){const [y,m,d]=e.date.split("-"),dt=new Date(+y,m-1,+d);return DAYS[(dt.getDay()+6)%7].slice(0,2)+", "+dt.getDate()+". "+MON[dt.getMonth()]+(e.tm?" · "+e.tm:"")}
function evRow(e,tk,tm){return `<button class="evr ${e.date<tk?"old":""}" data-ev="${e.id}"><span class="em">${e.e||"📌"}</span><span class="evm"><b>${esc(e.t)}</b><small>${evFmt(e)}</small></span>${e.date===tk?'<span class="tag">Heute</span>':e.date===tm?'<span class="tag">Morgen</span>':""}</button>`}
function eventsCard(){
  const n=new Date(),tk=key(n),tm=key(new Date(n.getFullYear(),n.getMonth(),n.getDate()+1));
  const ev=evSorted(data.events.filter(e=>e.date>=key(start)&&e.date<=key(new Date(start.getFullYear(),start.getMonth(),start.getDate()+6))));
  return `<section class="evc"><div class="evh"><b>📌 Termine dieser Woche</b><button data-evadd="1" aria-label="Termin hinzufügen">+ Termin</button></div>${ev.length?ev.map(e=>evRow(e,tk,tm)).join(""):`<div class="empty2">Keine Termine in dieser Woche</div>`}</section>`;
}
function dayEvents(k){
  const ev=evSorted(data.events.filter(e=>e.date===k));if(!ev.length)return "";
  return `<div class="dev">${ev.map(e=>evRow(e,"","")).join("")}</div>`;
}
function openEvent(id){
  const ex=id?data.events.find(e=>e.id===id):null,n=new Date();
  const base=ex?ex.date:(view&&view.date?key(view.date):(key(monday(n))===key(start)?key(n):key(start)));
  draft={e:ex&&ex.e?ex.e:"",tm:ex&&ex.tm?ex.tm:""};
  const o=sheet(`<h3>${ex?"Termin bearbeiten":"Neuer Termin"}</h3><div class="fg"><input type="text" id="et" placeholder="z. B. Schulaufgabe Mathe" value="${ex?esc(ex.t):""}"><input type="date" id="ed" value="${base}"><div class="two"><button id="etb" data-evtime="1">${draft.tm||"🕒 Uhrzeit"}</button><button id="eeb" data-evemo="1">${draft.e||"✨ Emoji"}</button></div></div><div class="two">${ex?`<button data-evdel="1">Löschen</button>`:`<button data-evx="1">Abbrechen</button>`}<button class="primary" data-evok="1">Speichern</button></div>`);
  o.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;const D=b.dataset;
    if(D.evtime)openTime();
    else if(D.evemo)openEmoji();
    else if(D.evx){o.remove();draft={e:"",tm:""}}
    else if(D.evdel){data.events=data.events.filter(x=>x.id!==id);save();o.remove();draft={e:"",tm:""};snd("del");render()}
    else if(D.evok){
      const t=o.querySelector("#et").value.trim(),d=o.querySelector("#ed").value;
      if(!t||!d){o.querySelector(t?"#ed":"#et").focus();return}
      const s0=suggest(t),rec={id:ex?ex.id:uid(),t,date:d,tm:draft.tm,e:draft.e||(s0==="📝"?"📌":s0)};
      if(ex)data.events[data.events.indexOf(ex)]=rec;else data.events.push(rec);
      save();o.remove();draft={e:"",tm:""};snd("add");render();
    }
  });
}
let draft={e:"",tm:""};
const EMO=["💼","📚","🏃","🛒","🍳","🧹","📞","💻","✉️","🎯","💪","🧘","🚗","🚆","✈️","🏥","💊","🦷","🛏️","☕","🍽️","🥗","🧺","🐶","🌳","🎂","🎁","📅","💡","✍️","🎵","🎮","📖","💰","🧾","🔧","🪴","🚿","🏋️","🚴","🏊","🎬","🎨","🧠","👫","😴","❤️","⭐"];
const AUTO=[[/arzt|zahn|klinik|ärztin/i,"🏥"],[/medikament|tablette/i,"💊"],[/einkauf|kaufen|supermarkt|shopping/i,"🛒"],[/sport|lauf|joggen|gym|fitness|training/i,"🏃"],[/yoga|meditat/i,"🧘"],[/koch|essen|mittag|abendessen|frühstück|backen/i,"🍳"],[/putz|aufräum|wasch|wäsche|staub/i,"🧹"],[/anruf|telefon/i,"📞"],[/mail|nachricht/i,"✉️"],[/lern|uni|schul|hausaufgabe|prüfung|klausur|test|referat/i,"📚"],[/arbeit|meeting|termin|projekt|büro|präsentation/i,"💼"],[/geburtstag|party|feier/i,"🎂"],[/auto|tanken|werkstatt/i,"🚗"],[/zug|bahn|bus|reise|flug/i,"🚆"],[/rechnung|bank|geld|miete|steuer/i,"💰"],[/hund|gassi|katze|tier/i,"🐶"],[/lesen|buch/i,"📖"],[/schlaf|pause|ausruh/i,"😴"],[/film|kino|serie/i,"🎬"],[/freund|treffen|date/i,"👫"],[/garten|pflanz/i,"🪴"]];
const suggest=t=>{for(const [r,e] of AUTO)if(r.test(t))return e;return "📝"};
function sheet(html){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sheet">${html}</div>`;o.addEventListener("click",e=>{if(e.target===o)o.remove()});document.body.appendChild(o);return o}
function openEmoji(){
  const o=sheet(`<h3>Emoji wählen</h3><div class="eg">${EMO.map(e=>`<button data-e="${e}">${e}</button>`).join("")}</div><button class="full" data-e="">✨ Automatisch passend</button>`);
  o.addEventListener("click",e=>{const b=e.target.closest("[data-e]");if(!b)return;draft.e=b.dataset.e;const eb=document.getElementById("eb");if(eb)eb.textContent=draft.e||"✨";const ee=document.getElementById("eeb");if(ee)ee.textContent=draft.e||"✨ Emoji";o.remove()});
}
function openTime(){
  const pad=n=>String(n).padStart(2,"0"),H=[...Array(24).keys()],M=[...Array(12).keys()].map(i=>i*5);
  const col=(a,id)=>`<div class="col" id="${id}">${a.map(n=>`<div class="it">${pad(n)}</div>`).join("")}</div>`;
  const o=sheet(`<h3>Uhrzeit</h3><div class="wheel"><div class="sel"></div>${col(H,"wh")}<div class="colon">:</div>${col(M,"wm")}</div><div class="two"><button data-act="clear">Ohne Zeit</button><button class="primary" data-act="ok">Fertig</button></div>`);
  const wh=o.querySelector("#wh"),wm=o.querySelector("#wm");
  let [h,m]=(draft.tm||"09:00").split(":").map(Number);m=Math.round(m/5)%12;
  wh.scrollTop=h*40;wm.scrollTop=m*40;
  const mark=c=>{const i=Math.round(c.scrollTop/40);if(c._i!==undefined&&c._i!==i)snd("tick");c._i=i;[...c.children].forEach((x,j)=>x.classList.toggle("on",i==j))};
  [wh,wm].forEach(c=>{mark(c);c.addEventListener("scroll",()=>mark(c));c.addEventListener("click",e=>{const i=[...c.children].indexOf(e.target);if(i>-1)c.scrollTo({top:i*40,behavior:"smooth"})})});
  o.addEventListener("click",e=>{const a=e.target.dataset.act;if(!a)return;draft.tm=a==="ok"?pad(Math.round(wh.scrollTop/40))+":"+pad(Math.round(wm.scrollTop/40)*5):"";const tb=document.getElementById("tb");if(tb)tb.textContent=draft.tm||"🕒";const etb=document.getElementById("etb");if(etb)etb.textContent=draft.tm||"🕒 Uhrzeit";o.remove()});
}
render();
</script>
