<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wochenplaner</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--ink:#2b2a33;--mute:#8a8794;--line:#e8e2d8;--acc:#e0694a;--acc2:#3f7d73;--gold:#e9a825;--today:#fff1ea;--shadow:0 2px 10px rgba(60,40,20,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161c;--card:#211f28;--ink:#efece6;--mute:#9a97a6;--line:#33303d;--acc:#f08a6c;--acc2:#6fb5a8;--gold:#f2b84b;--today:#2e2420;--shadow:0 2px 10px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#17161c;--card:#211f28;--ink:#efece6;--mute:#9a97a6;--line:#33303d;--acc:#f08a6c;--acc2:#6fb5a8;--gold:#f2b84b;--today:#2e2420;--shadow:0 2px 10px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 120px}
h1{margin:0;font:700 clamp(1.6rem,6vw,2.2rem)/1.1 Georgia,"Times New Roman",serif}
.sub{color:var(--mute);font-size:.95rem;margin-top:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:44px}
button:active{transform:scale(.97)}
.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.nav{display:flex;gap:6px}
.nav button{padding:8px 13px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;border:2px solid transparent;min-height:72px}
.row.today{background:var(--today);border-color:var(--acc)}
.row.goals{border-left:6px solid var(--acc2);border-radius:16px}
.row .mid{flex:1;min-width:0}
.row b{font-size:1.05rem;display:block}
.row small{color:var(--mute)}
.bar{height:7px;border-radius:7px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:7px;transition:width .5s}
.pct{font-weight:700;font-size:1.05rem;min-width:46px;text-align:right;color:var(--acc2)}
.pct.full{color:var(--gold)}
.chev{color:var(--mute);font-size:1.3rem}
.ringbox{display:flex;flex-direction:column;align-items:center;margin:6px 0 16px}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--acc2);transition:stroke-dashoffset .7s,stroke .3s}
.ring.full .fg{stroke:var(--gold)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 2rem/1 Georgia,serif}
.ring .num small{font:.8rem system-ui,sans-serif;color:var(--mute);margin-top:4px}
.ring.pop{animation:pop .7s}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-4deg)}70%{transform:scale(.96)}100%{transform:scale(1)}}
.win{color:var(--gold);font-weight:700;margin-top:8px;font-size:1.1rem;animation:fade .6s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px 8px 6px 14px;margin-bottom:8px;min-height:54px}
li input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc2);flex:none}
li .t{flex:1;word-break:break-word;padding:6px 0}
li.done .t{text-decoration:line-through;color:var(--mute)}
.tm{font-size:.78rem;background:var(--line);border-radius:7px;padding:2px 7px;margin-right:7px;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);font-size:1.5rem;padding:0 12px;min-height:44px}
.empty{text-align:center;color:var(--mute);padding:26px 0}
.addbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.add{display:flex;gap:8px;max-width:720px;margin:0 auto}
.add input{min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:46px}
.add input[type=text]{flex:1}
.add input[type=time]{width:96px;flex:none}
.add button{flex:none;width:50px;font-size:1.4rem;padding:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.em{font-size:1.5rem;flex:none}
.hero{display:block;width:100%;text-align:left;background:var(--acc);border:0;color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero.done{background:var(--gold)}
.hero small{opacity:.85}
.hero b{font-size:1.25rem;display:block}
.hero .hh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .big{font:700 2rem/1 Georgia,serif}
.hero .bar{background:rgba(255,255,255,.3);margin:10px 0}
.hero .bar i{background:#fff}
.hero .nx{display:flex;gap:8px;padding:3px 0;font-size:.95rem}
.row small{display:block;line-height:1.3}
.row .mid{flex:1 1 0}
.row.mini{min-height:44px;padding:8px 14px;margin-bottom:6px;gap:10px;box-shadow:none;background:transparent;border:1px solid var(--line);border-radius:12px;font-size:.9rem;color:var(--mute)}
.mini .mn{font-weight:700;width:24px;flex:none}
.mini .md{flex:none;width:62px}
.mini .ms{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mp{flex:none;font-weight:700}
.row.mini.ok{border-color:var(--acc2)}
.mini.ok .ms,.mini.ok .mp{color:var(--acc2)}
.row.mini.grp{border-style:dashed;justify-content:space-between;margin-top:8px}
.row.past{background:transparent;box-shadow:none;border-color:var(--line);color:var(--mute)}
.row.past b{font-weight:600}
.row.good{border-color:#3fa56b}
.row.bad{border-color:#e8613a}
.row.past.good{background:color-mix(in srgb,#3fa56b 8%,transparent)}
.row.past.bad{background:color-mix(in srgb,#e8613a 8%,transparent)}
.row.past.good small{color:#3fa56b}
.row.past.bad small{color:#e8613a}
.kw{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.sheet{max-height:92vh;overflow:auto}
.cm{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cm button{width:46px;font-size:1.3rem;padding:0}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cg>span{text-align:center;font-size:.75rem;color:var(--mute);align-self:center}
.cd{position:relative;padding:0;min-height:44px;border:2px solid transparent;background:none;font-size:1rem;border-radius:10px}
.cd.out{color:var(--mute);opacity:.45}
.cd.td{border-color:var(--acc)}
.cd i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc2)}
.cd i.g{background:var(--gold)}
button.wk{padding:0;min-height:44px;font-size:.85rem;border:0;background:var(--line);border-radius:10px;color:var(--mute);font-weight:600}
button.wk.cur{background:var(--acc);color:#fff}
.hint{text-align:center;color:var(--mute);font-size:.8rem;margin:0 0 10px}
.add .opt{width:50px;font-size:1.4rem}
.add .opt.tb{width:auto;min-width:56px;font-size:1rem;padding:0 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadeo .2s}
@keyframes fadeo{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.sheet{width:100%;max-width:720px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s}
.sheet h3{margin:0 0 8px;text-align:center}
.eg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:50vh;overflow:auto;margin-bottom:12px}
.eg button{font-size:1.6rem;padding:6px 0}
.full{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wheel{position:relative;display:flex;justify-content:center;gap:6px;height:200px;margin:10px 0 16px}
.sel{position:absolute;left:20%;right:20%;top:80px;height:40px;background:var(--line);border-radius:12px;opacity:.7;pointer-events:none;z-index:0}
.col{position:relative;z-index:1;width:90px;height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:80px 0;scrollbar-width:none;overscroll-behavior:contain}
.col::-webkit-scrollbar{display:none}
.it{height:40px;line-height:40px;text-align:center;font-size:1.3rem;color:var(--mute);scroll-snap-align:center;cursor:pointer}
.it.on{color:var(--ink);font-weight:700;font-size:1.7rem}
.colon{align-self:center;font-size:1.7rem;font-weight:700;position:relative;z-index:1}
.evc{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px;border-left:6px solid var(--acc)}
.evh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.evh button{padding:6px 12px;min-height:36px;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.evr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px dashed var(--line);background:none;border-radius:0;padding:8px 0;min-height:50px}
.evr.old{opacity:.5}
.evm{flex:1;min-width:0}
.evm b{display:block}
.evm small{color:var(--mute)}
.tag{background:var(--acc);color:#fff;border-radius:8px;font-size:.72rem;padding:2px 8px;font-weight:600;flex:none}
.empty2{color:var(--mute);font-size:.9rem;padding:8px 0 4px}
.fg{display:grid;gap:10px;margin-bottom:12px}
.fg input{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.dev{margin:0 0 12px}
.dev .evr{background:var(--card);border:0;border-left:5px solid var(--acc);border-radius:12px;padding:8px 12px;margin-bottom:6px;box-shadow:var(--shadow)}
@keyframes rise{from{opacity:0;transform:translate(var(--dx,0),10px)}}
@keyframes ringfill{from{stroke-dashoffset:402.2}}
.enter>*:not(.addbar):not(ul),.enter li{animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards}
.enter .ring .fg{animation:ringfill .9s ease-out}
@media (prefers-reduced-motion:reduce){.enter *{animation:none!important}}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;background:var(--bg);border-top:1px solid var(--line);padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs button{flex:1;max-width:340px;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:0;font-size:.78rem;min-height:48px;padding:4px}
.tabs button span{font-size:1.3rem;line-height:1.2}
.tabs button.on{color:var(--acc);font-weight:700}
.sc{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:6px 16px 8px;margin-bottom:12px}
.sc h2{font-size:1rem;margin:12px 0 4px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.srow.stk{flex-direction:column;align-items:stretch;gap:8px}
.srow small{display:block;color:var(--mute);font-size:.8rem;font-weight:400}
.swt{width:52px;height:30px;min-height:30px;border-radius:30px;padding:0;position:relative;background:var(--line);border:0;flex:none;transition:background .2s}
.swt i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.swt.on{background:var(--acc2)}
.swt.on i{transform:translateX(22px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pals button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;font-size:.75rem;min-height:64px}
.pals button i{width:28px;height:28px;border-radius:50%}
.pals button.picked{border:2px solid var(--ink)}
#vol{width:100%;accent-color:var(--acc)}
.wipe.arm{background:#e8613a;border-color:#e8613a;color:#fff}
.gear{font-size:1.4rem;width:48px;padding:0;flex:none;align-self:flex-start}
.pals{grid-template-columns:repeat(4,minmax(0,1fr))}
.swr{position:relative;margin-bottom:8px;border-radius:14px;overflow:hidden}
.swr li{margin:0;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swbg{position:absolute;inset:0;background:#e8613a;border-radius:14px;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;color:#fff;font-weight:700;opacity:0}
.swr.arm li{background:color-mix(in srgb,#e8613a 18%,var(--card))}
.planbtn{margin-bottom:12px;border-color:var(--acc);color:var(--acc);font-weight:600}
.tray{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);margin:0 -14px;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.chip{flex:none;white-space:nowrap;border-radius:20px;padding:8px 14px;min-height:40px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tl{position:relative;height:1024px;margin:20px 0 30px}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.hr span{position:absolute;top:-9px;left:0;width:44px;font-size:.72rem;color:var(--mute);background:var(--bg)}
.tlc{position:absolute;left:48px;right:0;top:0;bottom:0}
.tlc.pick{cursor:copy;background:color-mix(in srgb,var(--acc) 6%,transparent)}
.blk{position:absolute;display:flex;flex-direction:column;background:color-mix(in srgb,var(--acc) 18%,var(--card));border:2px solid var(--acc);border-radius:10px;padding:4px 8px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;z-index:2}
.blk.done{opacity:.55}
.blk.drag{box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:4;cursor:grabbing}
.blk .bt{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:24px}
.blk small{color:var(--mute);font-size:.72rem}
.blk .bx{position:absolute;top:0;right:0;border:0;background:none;padding:0 9px;min-height:30px;font-size:1.1rem;color:var(--mute)}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:18px;cursor:ns-resize}
.blk .rz::after{content:"";position:absolute;left:50%;bottom:4px;width:28px;height:4px;margin-left:-14px;border-radius:4px;background:var(--acc);opacity:.6}
.evb{position:absolute;border-left:5px solid var(--acc2);background:color-mix(in srgb,var(--acc2) 16%,var(--card));border-radius:8px;padding:3px 8px;font-size:.8rem;overflow:hidden;z-index:1;pointer-events:none}
.nowl{position:absolute;left:44px;right:0;height:2px;background:#e8613a;z-index:3;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#e8613a}
.fg{grid-template-columns:minmax(0,1fr)}
.fg>*{min-width:0}
.fg input[type=date],.fg input[type=text]{display:block;width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;text-align:left}
.fg input[type=date]::-webkit-date-and-time-value{text-align:left}
.sheet{overflow-x:hidden}
.wl{display:flex;justify-content:center;gap:70px;font-size:.8rem;color:var(--mute);margin-top:6px}
.qs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.qs button{padding:6px 12px;min-height:38px;border-radius:18px;font-size:.9rem}
.blk.sm{flex-direction:row;align-items:center;gap:6px;padding:0 6px 0 8px}
.blk.sm .bt{flex:1;min-width:0;font-size:.82rem;padding-right:0}
.blk.sm small{flex:none;font-size:.7rem;white-space:nowrap}
.blk.sm .bx{position:static;flex:none;min-height:24px;padding:0 4px}
.blk.sm .rz{height:10px}
.blk.sm .rz::after{bottom:2px;width:22px;height:3px;margin-left:-11px}
.zr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.zr .hint{margin:0;text-align:left;flex:1}
.zb{display:flex;gap:4px;flex:none}
.zb button{min-height:34px;padding:2px 11px;border-radius:10px}
.zb button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.swbg2{position:absolute;inset:0;background:var(--acc2);border-radius:14px;display:flex;align-items:center;justify-content:flex-start;padding-left:20px;color:#fff;font-weight:700;opacity:0}
.swr.armr li{background:color-mix(in srgb,var(--acc2) 18%,var(--card))}
.stb{border:0;background:none;font-size:1.25rem;padding:0 8px;min-height:44px;flex:none}
.sbts{display:block;margin-top:4px}
.sbt{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--mute);padding:3px 0}
.sbt input{width:18px;height:18px;accent-color:var(--acc2);flex:none}
.sbt.done{text-decoration:line-through}
.note{display:block;width:100%;font:inherit;font-size:16px;border:1px dashed var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin:6px 0 10px;resize:vertical;min-height:64px}
.pushbtn{margin-bottom:12px;border-color:var(--acc2);color:var(--acc2);font-weight:600}
.lbl{display:block;margin:10px 0 4px}
.qs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.srw{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 4px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.srw button{border:0;background:none;font-size:1.2rem;min-height:34px;padding:0 10px}
.tag.soft{background:var(--line);color:var(--ink)}
.rw{position:relative;margin-bottom:10px}
.rw .row{margin-bottom:0}
.mvb{position:absolute;right:12px;top:50%;transform:translateY(-50%);min-height:38px;padding:4px 12px;border-radius:12px;background:#e8613a;border-color:#e8613a;color:#fff;font-weight:600}
.sticky{position:relative;background:color-mix(in srgb,var(--acc) 32%,#ffffff);border-radius:3px 3px 16px 3px;padding:24px 16px 12px;margin:20px 6px 16px;box-shadow:0 10px 14px -8px rgba(0,0,0,.4),0 2px 3px rgba(0,0,0,.18);transform:rotate(-1deg)}
.sticky::before{content:"";position:absolute;top:-11px;left:50%;width:76px;height:22px;margin-left:-38px;background:rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.15);transform:rotate(2deg)}
.sticky .note{background:transparent;border:0;margin:0;padding:0;color:#2b2a33;font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;font-size:17px;line-height:1.5;min-height:88px;resize:none;outline:none}
.sticky .note::placeholder{color:rgba(43,42,51,.5)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<canvas id="fx"></canvas>
<script>
const DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
let data={tasks:{},goals:{}};
try{const s=localStorage.getItem("wochenplaner-v1");if(s)data=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem("wochenplaner-v1",JSON.stringify(data))}catch(e){}}
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let start=monday(new Date());
let view=null; // null = Woche, {goals:true} oder {date:Date}
let celebrate=false;

function confetti(){if(data.noConfetti)return;

  const cols=["#e0694a","#e9a825","#3f7d73","#6fb5a8","#f08a6c","#8e7cc3"];
  const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function step(){x.clearRect(0,0,cv.width,cv.height);f++;
    ps.forEach(p=>{p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-f/130);x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});

    bgD.style.opacity=dx<0?Math.min(1,-dx/(w*.3)):0;bgM.style.opacity=dx>0?Math.min(1,dx/(w*.3)):0;
    wr.classList.toggle("arm",dx<-w*.35);wr.classList.toggle("armr",dx>w*.35);
  };
  const up=()=>{
    cleanup();if(!on)return;
    lastSwipe=Date.now();li.style.transition="transform .2s";
    const id=wr.dataset.id;
    if(dx<-w*.35){
      li.style.transform="translateX(-110%)";bgD.style.opacity=1;
      setTimeout(()=>{const l=listOf(curKey()),i=l.findIndex(t=>t.id===id);if(i>-1)l.splice(i,1);save();snd("del");render()},200);
    }else if(dx>w*.35){
      li.style.transform="translateX(110%)";bgM.style.opacity=1;
      const d=view.date,tk=key(new Date()),nk=key(d)<tk?tk:key(new Date(d.getFullYear(),d.getMonth(),d.getDate()+1));
      setTimeout(()=>{moveTask(id,curKey(),nk);snd("add");render()},200);
    }else{li.style.transform="";bgD.style.opacity=0;bgM.style.opacity=0;wr.classList.remove("arm","armr")}
  };
  li.addEventListener("pointermove",mv);li.addEventListener("pointerup",up);li.addEventListener("pointercancel",up);
});
let draft={e:"",tm:""};
const EMO=["💼","📚","🏃","🛒","🍳","🧹","📞","💻","✉️","🎯","💪","🧘","🚗","🚆","✈️","🏥","💊","🦷","🛏️","☕","🍽️","🥗","🧺","🐶","🌳","🎂","🎁","📅","💡","✍️","🎵","🎮","📖","💰","🧾","🔧","🪴","🚿","🏋️","🚴","🏊","🎬","🎨","🧠","👫","😴","❤️","⭐"];
const AUTO=[[/arzt|zahn|klinik|ärztin/i,"🏥"],[/medikament|tablette/i,"💊"],[/einkauf|kaufen|supermarkt|shopping/i,"🛒"],[/sport|lauf|joggen|gym|fitness|training/i,"🏃"],[/yoga|meditat/i,"🧘"],[/koch|essen|mittag|abendessen|frühstück|backen/i,"🍳"],[/putz|aufräum|wasch|wäsche|staub/i,"🧹"],[/anruf|telefon/i,"📞"],[/mail|nachricht/i,"✉️"],[/lern|uni|schul|hausaufgabe|prüfung|klausur|test|referat/i,"📚"],[/arbeit|meeting|termin|projekt|büro|präsentation/i,"💼"],[/geburtstag|party|feier/i,"🎂"],[/auto|tanken|werkstatt/i,"🚗"],[/zug|bahn|bus|reise|flug/i,"🚆"],[/rechnung|bank|geld|miete|steuer/i,"💰"],[/hund|gassi|katze|tier/i,"🐶"],[/lesen|buch/i,"📖"],[/schlaf|pause|ausruh/i,"😴"],[/film|kino|serie/i,"🎬"],[/freund|treffen|date/i,"👫"],[/garten|pflanz/i,"🪴"]];
const suggest=t=>{if(data.noAuto)return "📝";for(const [r,e] of AUTO)if(r.test(t))return e;return "📝"};
function sheet(html){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sheet">${html}</div>`;o.addEventListener("click",e=>{if(e.target===o)o.remove()});document.body.appendChild(o);return o}
function openEmoji(){
  const o=sheet(`<h3>Emoji wählen</h3><div class="eg">${EMO.map(e=>`<button data-e="${e}">${e}</button>`).join("")}</div><button class="full" data-e="">✨ Automatisch passend</button>`);
  o.addEventListener("click",e=>{const b=e.target.closest("[data-e]");if(!b)return;draft.e=b.dataset.e;const eb=document.getElementById("eb");if(eb)eb.textContent=draft.e||"✨";const ee=document.getElementById("eeb");if(ee)ee.textContent=draft.e||"✨ Emoji";o.remove()});
}
function openTime(){
  const pad=n=>String(n).padStart(2,"0"),H=[...Array(24).keys()],M=[...Array(12).keys()].map(i=>i*5);
  const col=(a,id)=>`<div class="col" id="${id}">${a.map(n=>`<div class="it">${pad(n)}</div>`).join("")}</div>`;
  const o=sheet(`<h3>Uhrzeit</h3><div class="wheel"><div class="sel"></div>${col(H,"wh")}<div class="colon">:</div>${col(M,"wm")}</div><div class="two"><button data-act="clear">Ohne Zeit</button><button class="primary" data-act="ok">Fertig</button></div>`);
  const wh=o.querySelector("#wh"),wm=o.querySelector("#wm");
  let [h,m]=(draft.tm||"09:00").split(":").map(Number);m=Math.round(m/5)%12;
  wh.scrollTop=h*40;wm.scrollTop=m*40;
  const mark=c=>{const i=Math.round(c.scrollTop/40);if(c._i!==undefined&&c._i!==i)snd("tick");c._i=i;[...c.children].forEach((x,j)=>x.classList.toggle("on",i==j))};
  [wh,wm].forEach(c=>{mark(c);c.addEventListener("scroll",()=>mark(c));c.addEventListener("click",e=>{const i=[...c.children].indexOf(e.target);if(i>-1)c.scrollTo({top:i*40,behavior:"smooth"})})});
  o.addEventListener("click",e=>{const a=e.target.dataset.act;if(!a)return;draft.tm=a==="ok"?pad(Math.round(wh.scrollTop/40))+":"+pad(Math.round(wm.scrollTop/40)*5):"";const tb=document.getElementById("tb");if(tb)tb.textContent=fmtT(draft.tm)||"🕒";const etb=document.getElementById("etb");if(etb)etb.textContent=fmtT(draft.tm)||"🕒 Uhrzeit";o.remove()});
}
render();
